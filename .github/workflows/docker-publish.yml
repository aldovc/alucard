name: Build and push Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Compute semver tags
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          MINOR="${TAG%.*}"                 # e.g. v0.1
          MAJOR="${MINOR%.*}"              # e.g. v0
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aldovc/alucard:latest
            ghcr.io/aldovc/alucard:${{ steps.sha.outputs.short }}

      - name: Build and push (semver tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aldovc/alucard:latest
            ghcr.io/aldovc/alucard:${{ steps.sha.outputs.short }}
            ghcr.io/aldovc/alucard:${{ steps.semver.outputs.tag }}
            ghcr.io/aldovc/alucard:${{ steps.semver.outputs.minor }}
            ghcr.io/aldovc/alucard:${{ steps.semver.outputs.major }}
