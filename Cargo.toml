[package]
name = "alucard"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "=1.11.0", features = ["v4"] }

[profile.release]
strip = true
